<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#bfe8ff">
<title>Meu Aeroporto!</title>
<meta name="apple-mobile-web-app-title" content="Meu Aeroporto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2350;--muted:#6b6290;--accent:#ff6b8b;--accent-d:#d94a6c;--blue:#4d7cfe;--blue-d:#3157c9;--green:#2fc488;--green-d:#1f9566;--yellow:#ffc233;--yellow-d:#d39a0c;--purple:#8b5cf6;--purple-d:#6a3fd1;--line:#ece4f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:'Fredoka',ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
:root{color-scheme:light}
html,body{height:100%}
body{background:#ffeedd linear-gradient(180deg,#bfe8ff 0%,#ffeedd 70%,#ffe2cc 100%) fixed}
html[lang="vi"] body{font-family:'Nunito',ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,sans-serif}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:disabled{cursor:default}
#app{max-width:980px;margin:0 auto;padding-block:10px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column}
h1,h2,h3{margin:.3em 0;line-height:1.15}
h1{font-size:clamp(2rem,6vw,3.2rem)}
h2{font-size:clamp(1.3rem,3.6vw,1.9rem)}
h3{font-size:1.15rem}
p{margin:.4em 0;line-height:1.4}
small,.small{font-size:.9rem}
.center{text-align:center}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:8px}
.mt{margin-top:16px}
.muted{color:var(--muted)}
.no{color:#d22b4b}

/* barra de cima */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-height:48px}
.topbar .sp{flex:1}
.icon-btn{border:0;background:#fff;border-radius:16px;min-width:48px;height:48px;font-size:1.4rem;box-shadow:0 4px 0 rgba(43,35,80,.15);padding:0 10px}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,35,80,.15)}
.lang{display:flex;background:#fff;border-radius:16px;padding:4px;box-shadow:0 4px 0 rgba(43,35,80,.15)}
.lang button{border:0;background:transparent;border-radius:12px;padding:8px 9px;font-weight:600;min-width:38px}
.lang button.on{background:var(--ink);color:#fff}
.coin-chip{background:#fff;border-radius:999px;padding:9px 16px;font-weight:600;font-size:1.15rem;box-shadow:0 4px 0 rgba(43,35,80,.15)}
.bump{animation:bump .4s}

/* botoes */
.btn{--bg:var(--accent);--sh:var(--accent-d);border:0;border-radius:999px;padding:14px 26px;min-height:54px;font-size:1.15rem;font-weight:600;background:var(--bg);color:#fff;box-shadow:0 5px 0 var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s;line-height:1.1}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.btn.blue{--bg:var(--blue);--sh:var(--blue-d)}
.btn.green{--bg:var(--green);--sh:var(--green-d)}
.btn.yellow{--bg:var(--yellow);--sh:var(--yellow-d);color:var(--ink)}
.btn.purple{--bg:var(--purple);--sh:var(--purple-d)}
.btn.ghost{--bg:#fff;--sh:#d8cfe8;color:var(--ink)}
.btn.uber{--bg:#111;--sh:#000}
.btn.big{font-size:1.35rem;padding:18px 34px}
.btn:disabled{opacity:.45}

/* cards */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.grid.c5{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.card{background:#fff;border:0;border-radius:22px;padding:14px 12px;box-shadow:0 5px 0 rgba(43,35,80,.12);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .1s;position:relative}
button.card:active{transform:translateY(3px) scale(.98)}
.card.sel{outline:4px solid var(--accent);outline-offset:2px}
.card .n{font-weight:600;font-size:1.05rem}
.card .p{font-size:.95rem;color:var(--muted);font-weight:600}
.card.done{opacity:.55}
.card:disabled{opacity:.5}
.e{font-size:2.6rem;line-height:1.1}
.badge{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;border-radius:999px;padding:3px 9px;font-size:.78rem;font-weight:600}
.panel{background:rgba(255,255,255,.78);border-radius:26px;padding:16px;box-shadow:0 5px 0 rgba(43,35,80,.08)}
.flag{width:72px;height:48px;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.flag svg{width:100%;height:100%;display:block}

/* cenas */
.scene{position:relative;border-radius:26px;overflow:hidden;height:clamp(230px,40vh,390px);box-shadow:0 6px 0 rgba(43,35,80,.15);background:#cfe9ff;flex-shrink:0}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.av{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);height:66%}
.av svg{height:100%;width:auto;display:block}
.scene{container-type:size}
.crew{position:absolute;bottom:2%;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;z-index:1}
.crew .mem{width:min(var(--share),var(--hmax));position:relative;flex:none}
.crew .mem svg{width:100%;height:auto;display:block}
.crew .mem+.mem{margin-left:calc(min(var(--share),var(--hmax)) * -0.14)}
.crew.walk .mem svg{animation:bob 1.1s ease-in-out infinite}
.crew.walk .mem:nth-child(2n) svg{animation-delay:-.5s}
.crew .status{position:absolute;top:8%;right:-6%;font-size:clamp(1.6rem,5vw,2.4rem);animation:bob 1.4s ease-in-out infinite}
.fam-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.fam-grid .card{gap:10px}
.fam-av{height:190px;display:flex;align-items:flex-end;justify-content:center}
.fam-av svg{height:100%;width:auto}
.fam-grid .name-in{font-size:1.05rem;padding:8px 12px;text-align:center}
.fam-pick{border:0;background:#fff;border-radius:18px;padding:6px 8px 8px;box-shadow:0 3px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:.85rem;min-width:76px;opacity:.6}
.fam-pick.on{opacity:1;outline:3px solid var(--green);background:#e9fbf2}
.fam-pick .fh{width:58px;height:58px;border-radius:50%;overflow:hidden;background:#dfe9f7}
.fam-pick .fh svg{width:100%;height:100%}
.heads{display:flex;gap:4px}.heads div{width:70px;height:70px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.1)}.heads svg{width:100%;height:100%}
.crew-seats{position:absolute;left:48%;bottom:-4%;display:flex;gap:8px;height:70%}
.mini-seat{width:clamp(44px,8.5vw,78px);height:100%;background:#4d7cfe;border-radius:28px 28px 8px 8px;position:relative;box-shadow:inset 0 -10px 0 rgba(0,0,0,.15)}
.mini-seat.first{background:#8b5cf6}
.mini-seat>div{position:absolute;left:50%;top:6%;width:92%;transform:translateX(-50%)}
.mini-seat svg{width:100%;display:block}
.cabin.sleeping .mini-seat>div{transform:translateX(-50%) rotate(-14deg)}
.flag-emoji{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:44px;line-height:1;background:#f4f1fb}
.small-tabs{flex-wrap:wrap}.small-tabs button{min-width:30%;font-size:.95rem;padding:10px 4px;min-height:44px}
.cont-tabs{flex-wrap:wrap}.cont-tabs button{flex:1 1 30%;font-size:.95rem;min-height:46px}
.chip-btn.locked{opacity:.5;background:#efeaf7}
.plan h3{margin:12px 0 6px}
.polaroid .selfie{display:flex;justify-content:center;align-self:flex-end;width:100%}
.polaroid .selfie>div{flex:1;max-width:60%;margin:0 -6%}
.polaroid .selfie svg{width:100%;display:block}
.walk svg{animation:bob 1.1s ease-in-out infinite}
.status{position:absolute;top:-6%;right:-22%;font-size:clamp(1.6rem,5vw,2.4rem);animation:bob 1.4s ease-in-out infinite}
.bubble{position:absolute;background:#fff;border-radius:20px;padding:12px 16px;font-weight:500;box-shadow:0 4px 0 rgba(43,35,80,.12);max-width:min(62%,400px);font-size:clamp(.95rem,2.4vw,1.1rem);z-index:2}
.bubble:after{content:'';position:absolute;bottom:-10px;left:30px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.npc{position:absolute;font-size:clamp(3.6rem,11vw,6.5rem);line-height:1}
.deco{position:absolute;line-height:1}

/* casa */
.room{background:linear-gradient(#ffd9e6 0,#ffe9f1 66%,#d9a77a 66%,#c99566 100%)}
.room .win{position:absolute;top:10%;left:7%;width:22%;height:36%;background:linear-gradient(#8fd3ff,#d6f1ff);border:8px solid #fff;border-radius:14px;overflow:hidden}
.room .win:after{content:'☁️';position:absolute;top:18%;left:10%;font-size:1.8rem;animation:drift2 9s linear infinite}
.globe-btn{border:0;background:transparent;font-size:clamp(3.4rem,10vw,5.5rem);animation:pulse 1.6s ease-in-out infinite;padding:0}
.home-menu .card{min-height:130px;justify-content:center}

/* titulo */
.title-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px 0}
.globe{position:relative;width:200px;height:200px}
.globe .g{font-size:130px;line-height:200px}
.globe .orb{position:absolute;inset:0;animation:spin 4s linear infinite}
.globe .orb span{position:absolute;top:-6px;left:50%;font-size:46px;transform:translateX(-50%) rotate(45deg)}
.logo-title{font-size:clamp(2.6rem,9vw,4.4rem);color:var(--accent);text-shadow:0 5px 0 #fff,0 8px 0 rgba(43,35,80,.12);margin:0}

/* criar personagem */
.creator{display:grid;grid-template-columns:minmax(180px,290px) 1fr;gap:16px;align-items:start}
.preview{background:#fff4f8 radial-gradient(circle at 50% 40%,#fff,#ffe1ec);border-radius:26px;padding:12px;position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;box-shadow:0 5px 0 rgba(43,35,80,.1)}
.preview svg{width:100%;height:auto;max-height:52vh;display:block;margin:0 auto}
@media (max-width:640px){.creator{grid-template-columns:1fr}.preview{top:env(safe-area-inset-top,0px);padding:8px;box-shadow:0 6px 12px rgba(43,35,80,.18)}.preview svg{max-height:22vh}}
.opt h3{font-size:1rem;margin:12px 0 6px;color:var(--muted)}
.sw{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.12);padding:0}
.sw.on{outline:4px solid var(--ink);outline-offset:1px}
.chip-btn{border:0;background:#fff;border-radius:14px;padding:10px 14px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.1);min-height:46px}
.chip-btn.on{background:var(--ink);color:#fff}
.chip-btn.big{font-size:1.25rem;padding:14px 22px}
.name-in{font:inherit;font-size:1.3rem;padding:12px 16px;border-radius:16px;border:3px solid var(--line);width:100%;max-width:340px;font-weight:600;color:var(--ink);background:#fff}

/* mala */
.pack-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,240,228,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:0 0 24px 24px;padding:4px 8px 2px;margin:0 -8px 10px;box-shadow:0 8px 14px -10px rgba(43,35,80,.35)}
.pack-head p{margin:0 0 6px}
.suitcase{background:#ff8c42;border-radius:22px;padding:14px;position:relative;max-width:520px;margin:26px auto 12px;box-shadow:0 6px 0 #d96a1f}
.suitcase .handle{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:90px;height:26px;border:9px solid #b5541a;border-bottom:0;border-radius:16px 16px 0 0}
.inside{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1;background:rgba(255,255,255,.4);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.3rem,5vw,2.2rem);border:0;padding:0}
.slot.empty{border:3px dashed rgba(255,255,255,.75);background:transparent}
.card.item.in{background:#dff7ea;outline:3px solid var(--green)}
.card.item .chk{position:absolute;top:6px;right:8px}
.tip{background:#fff7d6;border-radius:18px;padding:12px 16px;font-weight:500}
.chk-line{font-size:1.1rem;text-align:left}

/* uber */
.phone{width:min(330px,92vw);margin:6px auto;background:#1d1b2e;border-radius:42px;padding:12px;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.phone .screen{background:#fff;border-radius:30px;min-height:430px;overflow:hidden;display:flex;flex-direction:column}
.pmap{flex:1;min-height:210px;position:relative;background:linear-gradient(90deg,rgba(0,0,0,.07) 2px,transparent 2px) 0 0/38px 38px,linear-gradient(rgba(0,0,0,.07) 2px,transparent 2px) 0 0/38px 38px,#e6f0de}
.pmap .road1{position:absolute;left:18%;top:20%;width:64%;height:62%;border:6px dashed #111;border-left:0;border-bottom:0;border-radius:0 40px 0 0}
.pmap .pin{position:absolute;font-size:2rem}
.pmap .pin.a{left:8%;top:9%}
.pmap .pin.b{right:6%;bottom:6%}
.pmap .mini-car{position:absolute;font-size:1.8rem;left:12%;top:12%;animation:minicar 3s ease-in-out forwards}
.sheet{padding:16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.u-row{font-size:1.1rem}
.driver{display:flex;align-items:center;gap:12px;text-align:left;background:#f4f4f6;border-radius:18px;padding:10px}
.dface{font-size:2.6rem}
.spinner{width:56px;height:56px;border:6px solid #eee;border-top-color:#111;border-radius:50%;animation:spin 1s linear infinite;margin:6px auto}
.road-scene{position:relative;height:clamp(240px,42vh,390px);border-radius:26px;overflow:hidden;background:linear-gradient(#9ad8ff,#e2f6ff 64%);box-shadow:0 6px 0 rgba(43,35,80,.15)}
.city{position:absolute;bottom:33%;left:0;white-space:nowrap;font-size:clamp(3rem,9vw,5rem);line-height:1;animation:scrollx 3s linear infinite;display:flex}
.city.far{bottom:40%;font-size:clamp(2rem,6vw,3rem);opacity:.45;animation-duration:7s}
.city span{padding-right:.3em}
.road{position:absolute;left:0;right:0;bottom:0;height:34%;background:#55586b}
.road:before{content:'';position:absolute;left:0;right:0;top:46%;height:8px;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 80px);animation:dash .35s linear infinite}
.road.stop:before{animation:none}
.car{position:absolute;bottom:14%;left:50%;width:clamp(170px,32vw,250px);transform:translateX(-50%);animation:carbob .3s ease-in-out infinite alternate}
.car svg{width:100%;display:block}
.car .wheel{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
.car.parked{animation:none;left:34%}
.car.parked .wheel{animation:none}
.terminal{position:absolute;right:5%;bottom:33%;text-align:center}

/* aeroporto */
.airport{background:linear-gradient(#eef4ff 0,#d6e4fb 62%,#b9c5da 62%,#a9b6cc 100%)}
.airport .win-strip{position:absolute;top:8%;left:0;right:0;height:26%;background:linear-gradient(90deg,#9fd6ff 0 18%,#d6e4fb 18% 20%) 0 0/120px 100%;opacity:.7}
.sign{position:absolute;top:6%;right:4%;background:#1d2a4d;color:#ffd84d;padding:6px 14px;border-radius:8px;font-weight:600;white-space:nowrap;font-size:.95rem;z-index:1}
.counter{position:absolute;left:4%;bottom:10%;width:38%;height:28%;background:var(--blue);border-radius:14px 14px 4px 4px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.15)}
.belt{position:absolute;left:0;right:0;bottom:3%;height:7%;background:repeating-linear-gradient(90deg,#333 0 20px,#4a4a4a 20px 40px);animation:dash .6s linear infinite}
.bag-anim{position:absolute;bottom:8%;font-size:3.4rem;animation:bagaway 1.6s ease-in forwards}
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;background:#c8d2e4;border-radius:18px;padding:14px;margin:12px auto;max-width:540px}
.tray button{font-size:2.6rem;background:#fff;border:0;border-radius:16px;width:78px;height:78px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.arch{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:26%;height:82%;border:14px solid #8a94ad;border-bottom:0;border-radius:18px 18px 0 0;transition:border-color .3s}
.arch.ok{border-color:var(--green)}
.walkthrough{animation:walkthru 1.4s ease-in-out forwards}
.steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:2px 0 10px}
.steps span{background:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;opacity:.55}
.steps span.on{opacity:1;background:var(--yellow)}
.steps span.ok{opacity:.95;background:#c9f2df}
.bpass{background:#fff;border-radius:18px;display:grid;grid-template-columns:1fr auto;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.1);max-width:540px;margin:14px auto;text-align:left;animation:pop .4s}
.bpass .main{padding:14px 16px}
.bpass .stub{background:var(--blue);color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:center;border-left:3px dashed #fff;min-width:96px;text-align:center}
.bpass.first .stub{background:var(--purple)}
.bp-route{display:flex;align-items:center;gap:10px;font-size:1.35rem;font-weight:700;margin:6px 0;flex-wrap:wrap}
.bp-grid{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}
.bp-grid small{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;font-weight:500}
.board{background:#121a33;color:#ffd84d;border-radius:18px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(.75rem,2.5vw,1rem);overflow-x:auto}
.board table{width:100%;border-collapse:collapse}
.board td,.board th{padding:8px 6px;text-align:left;white-space:nowrap}
.board th{color:#8ea2d8;font-weight:500}
.board tr.me{background:#22305a}
.blink{animation:blink 1s steps(2) infinite;color:#4dff9a}
.class-card{max-width:260px;flex:1;min-width:200px}
.class-card.first{background:linear-gradient(160deg,#fff,#efe6ff)}

/* passaporte */
.pp-book{background:#1f3a7a;border-radius:20px;padding:12px;box-shadow:0 6px 0 #142a5c;max-width:520px;margin:0 auto;width:100%}
.pp-cover-title{color:#f5d77a;font-weight:700;letter-spacing:.2em;text-align:center;padding:4px 0 10px}
.pp-page{background:linear-gradient(135deg,#fdf6e3,#f3ead2);border-radius:14px;padding:14px;display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;text-align:left;position:relative;min-height:160px}
.pp-photo{background:#dfe9f7;border-radius:10px;overflow:hidden;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.pp-photo svg{width:100%;height:auto;display:block}
.pp-lbl{font-size:.72rem;text-transform:uppercase;color:#8a7f5a;letter-spacing:.06em}
.pp-val{font-weight:600;font-size:1.1rem;margin-bottom:6px}
.pp-stamp{position:absolute;right:8px;bottom:4px;width:116px}
.stamp-in{animation:stampin .55s cubic-bezier(.2,1.6,.4,1) .35s both}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.stamp-slot{background:#fdf6e3;border-radius:16px;padding:10px;text-align:center}
.stamp-slot svg{width:100%;max-width:120px;transform:rotate(-8deg)}
.stamp-slot.empty svg{opacity:.2;filter:grayscale(1)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;padding:6px}
.polaroid{background:#fff;padding:8px 8px 12px;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.15);transform:rotate(var(--r,0deg));text-align:center}
.polaroid .ph{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:3.6rem;position:relative;overflow:hidden}
.polaroid .selfie{width:80%;align-self:flex-end}
.polaroid .selfie svg{width:100%;display:block}
.polaroid .corner{position:absolute;top:6px;right:6px;font-size:1.8rem}
.polaroid .cap{font-size:.9rem;margin-top:6px;font-weight:600}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;border:0;background:#fff;border-radius:16px;padding:12px 6px;font-weight:600;font-size:1.05rem;box-shadow:0 4px 0 rgba(43,35,80,.12);min-height:52px}
.tabs button.on{background:var(--ink);color:#fff}

/* voo */
.mapbox{background:#7fc7ef;border-radius:26px;overflow:hidden;box-shadow:0 6px 0 rgba(43,35,80,.15);transition:filter .8s}
.mapbox svg{display:block;width:100%;height:auto;max-height:46vh}
.mapbox.night{filter:brightness(.5) saturate(.7)}
.cabin{position:relative;margin-top:12px;border-radius:24px;height:clamp(150px,24vh,210px);overflow:hidden;box-shadow:0 5px 0 rgba(43,35,80,.12);background:linear-gradient(#e9eef8,#cfd8ea);transition:background .8s}
.cabin.first{background:linear-gradient(#f3e9ff,#d9c6ff)}
.cabin.sleeping{background:linear-gradient(#2a2c5e,#46407a)}
.cabin .label{position:absolute;z-index:3;top:10px;left:14px;font-weight:700;background:#fff;border-radius:999px;padding:4px 12px;font-size:.9rem}
.cabin .porthole{position:absolute;right:3%;top:18%;width:16%;max-width:110px;aspect-ratio:3/4;border-radius:40%;border:8px solid #fff;background:linear-gradient(#7cc8ff,#d6f1ff);overflow:hidden}
.cabin.sleeping .porthole{background:linear-gradient(#141640,#2e2a6b)}
.cabin .porthole:after{content:'☁️';position:absolute;top:30%;font-size:1.8rem;animation:drift2 4s linear infinite}
.cabin.sleeping .porthole:after{content:'⭐';font-size:1.1rem}
.seat{position:absolute;left:18%;bottom:-6%;width:clamp(120px,22vw,170px);height:92%;background:#4d7cfe;border-radius:40px 40px 10px 10px;box-shadow:inset 0 -14px 0 rgba(0,0,0,.15)}
.cabin.first .seat{background:#8b5cf6;width:clamp(150px,28vw,220px);transition:all .8s}
.sleeper{position:absolute;left:50%;top:6%;width:72%;transform:translateX(-50%);transition:transform .8s}
.sleeper svg{width:100%;display:block}
.cabin.eco.sleeping .sleeper{transform:translateX(-50%) rotate(-16deg)}
.bed{position:absolute;left:5%;bottom:8%;width:68%;height:42%;background:#8b5cf6;border-radius:26px;box-shadow:inset 0 -12px 0 rgba(0,0,0,.15);animation:fade .6s}
.pillow{position:absolute;left:3%;top:-34%;width:30%;height:70%;background:#fff;border-radius:40%;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.bed-head{position:absolute;left:4%;bottom:22%;width:30%;transform:rotate(-62deg);transform-origin:50% 60%}
.bed-head svg{width:100%;display:block}
.blanket{position:absolute;left:30%;right:2%;top:-22%;height:86%;background:repeating-linear-gradient(45deg,#ffb3c7 0 14px,#ff9ab5 14px 28px);border-radius:30px 30px 16px 16px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.zzz{position:absolute;left:44%;top:14%;font-size:2rem;font-weight:700;color:#fff;opacity:0}
.cabin.sleeping .zzz{animation:zzz 2s ease-out infinite}
.clouds-strip{height:54px;position:relative;overflow:hidden;font-size:2rem;margin-top:6px}
.clouds-strip .cl{position:absolute;white-space:nowrap;animation:scrollx 9s linear infinite;display:flex}

/* dia */
.hud{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.hud .chip{background:#fff;border-radius:16px;padding:10px 14px;font-weight:600;box-shadow:0 4px 0 rgba(43,35,80,.12);white-space:nowrap}
.hud .clock{flex:1;background:#fff;border-radius:16px;padding:6px 12px;box-shadow:0 4px 0 rgba(43,35,80,.12);min-width:0}
.hud .clock .tt{font-weight:600;display:flex;justify-content:space-between;gap:8px}
@media (max-width:560px){.hud{flex-wrap:wrap}.hud .clock{order:3;flex-basis:100%}.hud .chip{flex:1}}
.bar{height:12px;background:#eee;border-radius:999px;overflow:hidden;margin-top:4px}
.bar>div{height:100%;background:linear-gradient(90deg,#ffd23f,#ff9a3c);width:0;border-radius:999px;transition:width .25s linear}
.bar.late>div{background:linear-gradient(90deg,#ff9a3c,#ff4d6d)}
.act.need{outline:3px dashed var(--accent)}
.emoji-row{font-size:2rem;letter-spacing:.1em;line-height:1.5}
.cloud{animation:drift 46s linear infinite}

/* resumo */
.stats .card{min-height:110px;justify-content:center}
.stats .big-n{font-size:2rem;font-weight:700}

/* hospedagem */
.keycard{display:flex;align-items:center;gap:12px;max-width:320px;margin:14px auto;background:linear-gradient(135deg,#ffd84d,#ffb703);border-radius:18px;padding:12px 18px;box-shadow:0 6px 0 #d39a0c;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.keycard span{font-size:2.4rem}.keycard b{font-size:1.8rem}.keycard small{margin-left:auto;font-weight:600;color:#6b4a00;text-align:right}
.sparkles{position:absolute;top:12%;left:22%;font-size:2.2rem;animation:twinkle 1.6s ease-in-out infinite;z-index:2;pointer-events:none}
.sparkles.s2{left:70%;top:22%;animation-delay:-.6s}.sparkles.s3{left:48%;top:6%;animation-delay:-1.1s;font-size:1.6rem}
@keyframes twinkle{50%{transform:scale(1.4) rotate(20deg);opacity:.4}}
.pp-multi{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));max-height:58vh;overflow:auto}
.pp-multi .pp-page{grid-template-columns:80px 1fr;min-height:120px}.pp-multi .pp-stamp{width:86px}
.fl-left{font-weight:700;font-size:1.15rem;margin:0 0 8px}
/* modal e efeitos */
.overlay{position:fixed;inset:0;background:rgba(30,22,60,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .2s}
.modal{background:#fff;border-radius:28px;width:100%;max-width:540px;max-height:92vh;overflow:auto;padding:22px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 0 rgba(0,0,0,.15)}
.modal div.big{font-size:4.5rem;line-height:1.1}
.night-cover{position:fixed;inset:0;background:radial-gradient(circle at 70% 25%,#3a3d8a,#141533);z-index:55;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:4rem;animation:fade .5s}
.night-cover small{font-size:1.4rem;margin-top:10px}
.toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;z-index:70;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:toast 2.6s forwards;max-width:90vw;text-align:center}
.floaty{position:fixed;left:50%;top:42%;pointer-events:none;font-size:3.4rem;z-index:65;animation:floatup 1.3s ease-out forwards}

@keyframes bob{50%{transform:translateY(-4%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes bump{50%{transform:scale(1.18)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
@keyframes floatup{from{transform:translateX(-50%)}to{transform:translate(-50%,-140px) scale(1.4);opacity:0}}
@keyframes stampin{from{transform:scale(2.6) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-10deg);opacity:1}}
@keyframes scrollx{to{transform:translateX(-50%)}}
@keyframes dash{to{background-position:-80px 0}}
@keyframes carbob{to{transform:translate(-50%,-3px)}}
@keyframes bagaway{from{left:58%}to{left:110%}}
@keyframes walkthru{from{left:18%}to{left:84%}}
@keyframes blink{50%{opacity:.2}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(900px)}}
@keyframes drift2{from{left:110%}to{left:-40%}}
@keyframes minicar{to{left:72%;top:66%}}
@keyframes zzz{0%{opacity:0;transform:translate(0,10px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(30px,-40px) scale(1.2)}}
.shake{animation:shake .4s}

html,body{overscroll-behavior:none}
@media (display-mode: standalone), (display-mode: fullscreen){#app{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(28px,env(safe-area-inset-bottom))}}

mbia như vẹt đuôi dài và chim toucan. Colombia là nước có nhiều loài chim nhất thế giới!"]},{"id":"charrete","e":"🐴","p":12,"n":["Passeio de charrete","Balade en calèche","Đi xe ngựa"],"f":["À noite, as charretes passeiam pelas ruas antigas com sacadas cheias de flores.","Le soir, les calèches se promènent dans les vieilles rues aux balcons pleins de fleurs.","Buổi tối, xe ngựa dạo qua những con phố cổ có ban công đầy hoa."]},{"id":"barco","e":"⛵","p":16,"n":["Pôr do sol de barco","Coucher de soleil en bateau","Ngắm hoàng hôn trên thuyền"],"f":["Um passeio de barco pela baía no fim da tarde, vendo o céu ficar laranja e rosa.","Une balade en bateau dans la baie en fin d’après-midi, pendant que le ciel devient orange et rose.","Đi thuyền trên vịnh lúc chiều tà, ngắm bầu trời chuyển sang màu cam và hồng."]}],"shop":[{"id":"cafe","e":"☕","p":8,"n":["Pacote de café","Paquet de café","Gói cà phê"],"f":["A Colômbia é um dos maiores produtores de café do mundo. Um presente para os adultos da família!","La Colombie est un des plus grands producteurs de café du monde. Un cadeau pour les grands de la famille !","Colombia là một trong những nước sản xuất cà phê lớn nhất thế giới. Món quà cho người lớn trong nhà!"]},{"id":"mochila","e":"👜","p":14,"n":["Mochila wayuu","Sac wayuu","Túi wayuu"],"f":["Bolsas coloridas tecidas à mão pelo povo wayuu. Fazer uma só pode levar semanas!","Des sacs colorés tissés à la main par le peuple wayuu. En faire un seul peut prendre des semaines !","Túi nhiều màu do người Wayuu dệt bằng tay. Làm một chiếc có thể mất cả mấy tuần!"]},{"id":"palenquera","e":"🪆","p":10,"n":["Boneca palenquera","Poupée palenquera","Búp bê palenquera"],"f":["Bonequinha com vestido nas cores da Colômbia e uma bacia de frutas na cabeça.","Une petite poupée avec une robe aux couleurs de la Colombie et une bassine de fruits sur la tête.","Búp bê nhỏ mặc váy màu cờ Colombia, đội chậu trái cây trên đầu."]},{"id":"esmeralda","e":"💎","p":16,"n":["Chaveiro de esmeralda","Porte-clés émeraude","Móc khóa ngọc lục bảo"],"f":["A Colômbia é famosa no mundo todo pelas suas esmeraldas, pedras de um verde brilhante.","La Colombie est célèbre dans le monde entier pour ses émeraudes, des pierres d’un vert brillant.","Colombia nổi tiếng khắp thế giới với ngọc lục bảo, loại đá màu xanh lá óng ánh."]}],"walk":[{"e":"🦥","t":["Uma preguiça dormia pendurada numa árvore do parque. Bem devagarinho, ela abriu um olho!","Un paresseux dormait suspendu à un arbre du parc. Tout doucement, il a ouvert un œil !","Một chú lười đang ngủ treo mình trên cây trong công viên. Thật chậm rãi, nó mở một mắt ra!"]},{"e":"💃","t":["Dançarinos de cumbia apareceram na praça com saias enormes e coloridas!","Des danseurs de cumbia sont arrivés sur la place avec d’immenses jupes colorées !","Các vũ công cumbia xuất hiện ở quảng trường với những chiếc váy to và sặc sỡ!"]},{"e":"🪙","coins":2,"t":["Você achou 2 moedas na calçada perto da muralha!","Tu as trouvé 2 pièces sur le trottoir près de la muraille !","Bạn tìm thấy 2 xu trên vỉa hè gần tường thành!"]},{"e":"🌺","t":["As sacadas das casas estavam cheias de flores cor-de-rosa caindo até a rua.","Les balcons des maisons étaient couverts de fleurs roses qui tombaient jusqu’à la rue.","Ban công các ngôi nhà đầy hoa màu hồng rủ xuống tận mặt đường."]}],"pos":{"x":290,"y":221}},"costarica":{"continent":"america","flag":"🇨🇷","lat":9.93,"lon":-84.08,"name":["Costa Rica","Costa Rica","Costa Rica"],"city":["San José","San José","San José"],"apt":"Juan Santamaría","to":["para a Costa Rica","au Costa Rica","Costa Rica"],"dest":["para a Costa Rica","vers le Costa Rica","Costa Rica"],"climate":["Úmido 🌦️","Humide 🌦️","Ẩm ướt 🌦️"],"currency":["Colón (₡)","Colón (₡)","Colón (₡)"],"tip":["Na floresta da Costa Rica chove quase toda tarde e tem muitos mosquitinhos.","Dans la forêt du Costa Rica, il pleut presque tous les après-midi et il y a beaucoup de moustiques.","Trong rừng ở Costa Rica, chiều nào cũng hay mưa và có rất nhiều muỗi."],"needs":["gu r as badaladas de longe!","Big Ben, c’est le nom de la cloche géante cachée dans la tour de l’horloge. On l’entend sonner de loin !","Big Ben là tên của chiếc chuông khổng lồ bên trong tháp đồng hồ. Có thể nghe tiếng chuông từ rất xa!"]},{"id":"londoneye","e":"🎡","p":22,"n":["London Eye","London Eye","Vòng quay London Eye"],"f":["Uma roda-gigante de 135 metros na beira do rio. Uma volta inteira demora uns 30 minutos!","Une grande roue de 135 mètres au bord du fleuve. Un tour complet dure environ 30 minutes !","Vòng đu quay cao 135 mét bên bờ sông. Quay hết một vòng mất khoảng 30 phút!"]},{"id":"torrelondres","e":"👑","p":20,"n":["Torre de Londres","Tour de Londres","Tháp Luân Đôn"],"f":["Lá ficam guardadas as joias da coroa, cheias de diamantes. E uns corvos grandões moram no jardim!","On y garde les joyaux de la Couronne, pleins de diamants. Et de gros corbeaux vivent dans le jardin !","Nơi đây cất giữ những món trang sức của hoàng gia, đầy kim cương. Và có những chú quạ to sống trong vườn!"]},{"id":"buckingham","e":"💂","p":0,"n":["Palácio de Buckingham","Palais de Buckingham","Cung điện Buckingham"],"f":["Na frente do palácio tem a troca da guarda, com guardas de casaco vermelho e chapéu peludo bem alto.","Devant le palais, il y a la relève de la garde, avec des gardes en veste rouge et un très haut chapeau en poils.","Trước cung điện có lễ đổi gác, với những người lính gác mặc áo đỏ và đội mũ lông rất cao."]},{"id":"historianatural","e":"🦕","p":0,"n":["Museu de História Natural","Muséum d’histoire naturelle","Bảo tàng Lịch sử Tự nhiên"],"f":["É de graça! Tem dinossauros e um esqueleto de baleia-azul enorme pendurado no teto.","C’est gratuit ! Il y a des dinosaures et un énorme squelette de baleine bleue accroché au plafond.","Vào cửa miễn phí! Có khủng long và một bộ xương cá voi xanh khổng lồ treo trên trần nhà."]},{"id":"onibus","e":"🚌","p":5,"n":["Ônibus de dois andares","Bus à impériale","Xe buýt hai tầng"],"f":["O melhor lugar do ônibus vermelho é no andar de ,"Đây là điểm cực tây của lục địa châu Phi. Phía bên kia đại dương là châu Mỹ!"]},{"id":"soumbedioune","e":"🛶","p":0,"n":["Pirogas de Soumbédioune","Pirogues de Soumbédioune","Thuyền pirogue ở Soumbédioune"],"f":["No fim da tarde, barcos de pesca pintados com mil cores chegam à praia cheios de peixes.","En fin d’après-midi, des bateaux de pêche peints de mille couleurs arrivent sur la plage remplis de poissons.","Chiều tối, những chiếc thuyền đánh cá sơn đủ màu cập bờ đầy ắp cá."]},{"id":"baoba","e":"🌳","p":0,"n":["Baobá gigante","Baobab géant","Cây bao báp khổng lồ"],"f":["O baobá é a árvore símbolo do Senegal. Alguns são tão grossos que precisa de várias pessoas para abraçar!","Le baobab est l’arbre symbole du Sénégal. Certains sont si gros qu’il faut plusieurs personnes pour les entourer !","Cây bao báp là biểu tượng của Senegal. Có cây to đến mức cần nhiều người mới ôm hết!"]},{"id":"bandia","e":"🦒","p":22,"n":["Reserva de Bandia","Réserve de Bandia","Khu bảo tồn Bandia"],"f":["De jipe, você vê girafas, zebras e rinocerontes passeando entre os baobás.","En 4x4, tu vois des girafes, des zèbres et des rhinocéros se promener entre les baobabs.","Ngồi xe jeep, bạn sẽ thấy hươu cao cổ, ngựa vằn và tê giác dạo bước giữa những cây bao báp."]},{"id":"villagearts","e":"🎨","p":5,"n":["Vila das Artes","Village des Arts","Làng Nghệ thuật"],"f":["Um lugar onde artistas pintam e fazem esculturas. Você pode ver eles trabalhando!","Un endroit où des artistes peignent et sculptent. Tu peux les voir travailler !","Nơi các nghệ sĩ vẽ tranh và làm tượng. Bạn có thể xem họ làm việc!"]},{"id":"museu","e":"🏛️","p":8,"n":["Museu das Civilizações Negras","Musée des Civilisations noires","Bảo tàng Văn minh Da đen"],"f":["Um museu enorme e redondo, com máscaras, tecidos e instrumentos de toda a África.","Un immense musée rond, avec des masques, des tissus et des instruments de toute l’Afrique.","Một bảo tàng hình tròn rất lớn, có mặt nạ, vải vóc và nhạc cụ từ khắp châu Phi."]},{"id":"luta or","repelente"],"uncomfy":"🦟","color":"#1e64a8","stampE":"🦒","icons":"🦒🦁⛰️","photoBg":"linear-gradient(#ffe2a8,#fff6e0)","scene":{"type":"savana","landmark":"🦒","deco":["⛰️","🐘","🌳"]},"hello":{"show":"Jambo! Karibu Tanzania!","say":"Jambo! Karibu Tanzania!","lang":"sw-TZ","tr":["Olá! Bem-vinda à Tanzânia!","Bonjour ! Bienvenue en Tanzanie !","Xin chào! Chào mừng đến Tanzania!"]},"eat":[{"id":"chipsimayai","e":"🍳","p":5,"n":["Chipsi mayai","Chipsi mayai","Chipsi mayai (trứng chiên khoai tây)"],"f":["Uma omelete com batata frita dentro! É um dos lanches de rua mais famosos da Tanzânia.","Une omelette avec des frites dedans ! C’est un des en-cas de rue les plus célèbres de Tanzanie.","Món trứng chiên với khoai tây chiên bên trong! Đây là một trong những món ăn đường phố nổi tiếng nhất Tanzania."]},{"id":"ugali","e":"🌽","p":5,"n":["Ugali","Ugali","Ugali (bột ngô)"],"f":["Uma massa firme de farinha de milho. Come-se com a mão, fazendo bolinhas para pegar o molho!","Une pâte ferme de farine de maïs. On la mange avec la main, en faisant des boulettes pour attraper la sauce !","Một loại bột ngô nấu đặc. Người ta ăn bằng tay, vo thành viên nhỏ để chấm nước sốt!"]},{"id":"mandazi","e":"🍩","p":3,"n":["Mandazi","Mandazi","Bánh rán mandazi"],"f":["Bolinho frito fofinho, às vezes com sabor de coco e cardamomo. Perfeito no café da manhã!","Un beignet tout moelleux, parfois parfumé à la noix de coco et à la cardamome. Parfait au petit-déjeuner !","Bánh rán mềm xốp, đôi khi có vị dừa và bạch đậu khấu. Rất hợp cho bữa sáng!"]},{"id":"nyamachoma","e":"🍖","p":10,"n":["Nyama choma","Nyama choma","Thịt nướng nyama choma"],"f":["Nyama choma quer dizer carne assada em suaíli. As famílias se reúnem em volta da grelha!","Nyama choma veut dire viande grillée en swahili. Les familles se réunissent autour du grill !","Nyama choma nghĩa là thịt nướng trong tiếng Swahili. Cả gia đình quây quần bên bếp nướng!"]},{"id":"ndizi","e":"🍌","p":3,"n":["Ndizi (banana)","Ndizi (banane)","Chuối ndizi"],"f":["Banana em suaíli é ndizi. Perto do Kilimanjaro tem muita bananeira, e lá comem banana frita, cozida e até em sopa!","Banane se dit ndizi en swahili. Près du Kilimandjaro, il y a plein de bananiers : on la mange frite, cuite et même en soupe !","Chuối trong tiếng Swahili là ndizi. Gần núi Kilimanjaro có rất nhiều chuối, người ta ăn chuối chiên, chuối luộc và cả súp chuối!"]}],"visit":[{"id":"serengeti","e":"🦁","p":25,"n":["Safári no Serengeti","Safari dans le Serengeti","Đi safari ở Serengeti"],"f":["Todo ano, mais de um milhão de gnus e zebras andam juntos procurando capim verde. É a Grande Migração!","Chaque année, plus d’un million de gnous et de zèbres marchent ensemble pour trouver de l’herbe verte. C’est la Grande Migration !","Mỗi năm, hơn một triệu con linh dương đầu bò và ngựa vằn cùng nhau đi tìm cỏ xanh. Đó là cuộc Đại di cư!"]},{"id":"ngorongoro","e":"🦏","p":22,"n":["Cratera de Ngorongoro","Cratère du Ngorongoro","Miệng núi lửa Ngorongoro"],"f":["É a cratera gigante de um vulcão antigo, cheia de leões, elefantes e até rinocerontes!","C’est le cratère géant d’un ancien volcan, rempli de lions, d’éléphants et même de rhinocéros !","Đây là miệng núi lửa cổ khổng lồ, đầy sư tử, voi và cả tê giác!"]},{"id":"kilimanjaro","e":"⛰️","p":0,"n":["Vista do Kilimanjaro","Vue sur le Kilimandjaro","Ngắm núi Kilimanjaro"],"f":["A montanha mais alta da África, com 5.895 metros. Mesmo perto do equador, tem neve no topo!","La plus haute montagne d’Afrique : 5 895 mètres. Même près de l’équateur, il y a de la neige au sommet !","Ngọn núi cao nhất châu Phi, cao 5.895 mét. Dù gần xích đạo, trên đỉnh vẫn có tuyết!"]},{"id":"tarangire","e":"🐘","p":18,"n":["Parque Tarangire","Parc de Tarangire","Công viên Tarangire"],"f":["Parque famoso pelas manadas de elefantes e pelos baobás, árvores gordinhas que guardam água no tronco.","Un parc célèbre pour ses troupeaux d’éléphants et ses baobabs, des arbres dodus qui gardent l’eau dans leur tronc.","Công viên nổi tiếng với những đàn vo ts et des petits plats depuis leurs bateaux, au milieu du canal !","Người bán hàng bán trái cây và đồ ăn ngay trên thuyền, giữa dòng kênh!"]},{"id":"barco","e":"⛴️","p":3,"n":["Barco no rio Chao Phraya","Bateau sur le Chao Phraya","Thuyền trên sông Chao Phraya"],"f":["Em Bangkok, o barco é como um ônibus: leva as pessoas pelo rio, passando pelos templos.","À Bangkok, le bateau est comme un bus : il emmène les gens sur le fleuve, devant les temples.","Ở Bangkok, thuyền giống như xe buýt: chở mọi người dọc sông, đi ngang qua các ngôi chùa."]},{"id":"lumphini","e":"🦎","p":0,"n":["Parque Lumphini","Parc Lumpini","Công viên Lumphini"],"f":["Neste parque vivem lagartos enormes, maiores que um cachorro, tomando sol perto do lago!","Dans ce parc vivent d’énormes lézards, plus grands qu’un chien, qui prennent le soleil près du lac !","Trong công viên này có những con kỳ đà to hơn cả con chó, nằm phơi nắng bên hồ!"]},{"id":"chatuchak","e":"🛍️","p":0,"n":["Mercado Chatuchak","Marché de Chatuchak","Chợ Chatuchak"],"f":["Um dos maiores mercados do mundo, com mais de 15 mil barraquinhas. Dá para se perder!","Un des plus grands marchés du monde, avec plus de 15 000 stands. On peut s’y perdre !","Một trong những khu chợ lớn nhất thế giới, với hơn 15.000 gian hàng. Dễ bị lạc lắm đấy!"]},{"id":"maeklong","e":"🚂","p":6,"n":["Mercado do trem","Marché du train","Chợ đường ray"],"f":["O trem passa bem no meio do mercado! As barracas fecham os toldos e abrem de novo logo depois.","Le train passe en plein milieu du marché ! Les vendeurs replient leurs auvents et les rouvrent juste après.","Tàu hỏa chạy ngay giữa khu chợ! Người bán thu mái che lại rồi mở ra ngay sau đó."]},{"id":"sealife","e":"🦈","p":18,"n":["Aquário Sea Life","Aquarium Sea Life","Thủy cung Sea Life"],"f":["Um aquário embaixo de um shopping, com túnel de vidro onde tubarões passam por cima de você!","Un aquarium sous un centre commercial, avec un tunnel en verre où les requins passent au-dessus de toi !","Thủy cung dưới tầng hầm một trung tâm thương mại, có đường hầm kính nơi cá mập bơi ngay trên đầu bạn!"]},{"id":"ayutthaya","e":"🏛️","p":15,"n":["Ayutthaya","Ayutthaya","Cố đô Ayutthaya"],"f":["Uma cidade antiga cheia de ruínas. Num templo, a cabeça de uma estátua ficou presa nas raízes de uma árvore!","Une ancienne ville pleine de ruines. Dans un temple, la tête d’une statue est prise dans les racines d’un arbre !","Một thành phố cổ đầy tàn tích. Ở một ngôi chùa, đầu một bức tượng nằm giữa rễ cây!"]}],"shop":[{"id":"calca","e":"👖","p":8,"n":["Calça de elefante","Pantalon éléphant","Quần voi"],"f":["Calça leve e fresquinha com estampa de elefantes. O elefante é o animal símbolo da Tailândia!","Un pantalon léger avec des motifs d’éléphants. L’éléphant est l’animal symbole de la Thaïlande !","Quần nhẹ, mát với họa tiết voi. Voi là con vật biểu tượng của Thái Lan!"]},{"id":"sombrinha","e":"☂️","p":10,"n":["Sombrinha de papel","Ombrelle en papier","Ô giấy"],"f":["Sombrinhas de papel pintadas à mão com flores. As mais famosas vêm de uma vila chamada Bo Sang.","Des ombrelles en papier peintes à la main avec des fleurs. Les plus célèbres viennent d’un village appelé Bo Sang.","Những chiếc ô giấy vẽ hoa bằng tay. Nổi tiếng nhất là ô từ làng Bo Sang."]},{"id":"tuktuk","e":"🛺","p":6,"n":["Tuk-tuk de brinquedo","Tuk-tuk miniature","Xe tuk-tuk đồ chơi"],"f":["O tuk-tuk tem só 3 rodas, e o nome vem do barulhinho do motor: tuk-tuk-tuk!","Le tuk-tuk n’a que 3 roues, et son nom vient du bruit du moteur : tuk-tuk-tuk !","Xe tuk-tuk chỉ có 3 bánh, và tên gọi đến từ tiếng động cơ: tuk-tuk-tuk!"]},{"id":"sabonete","e":"🌸","p":4,"n":["Sabonete em flor","Savon en forme de fleur","Xà phòng hình hoa"],"f":["Os artesãos tailandeses esculpem sabonetes e frutas em forma de flores cheias de detalhes.","Les artisans thaïlandais sculptent des savons et des fruits en forme de fleurs pleines de détails.","Nghệ nhân Thái Lan khắc xà phòng và trái cây thành những bông hoa đầy chi tiết."]}],"walk":[{"e":"🛺","t":["Um tuk-tuk colorido passou buzinando, todo enfeitado com luzinhas!","Un tuk-tuk coloré est passé en klaxonnant, décoré de petites lumières !","Một chiếc tuk-tuk sặc sỡ chạy qua bấm còi, trang trí đầy đèn nhỏ!"]},{"e":"🌧️","t":["Caiu uma chuva fortíssima por 10 minutos. Depois o sol voltou como se nada tivesse acontecido!","Une très grosse pluie est tombée pendant 10 minutes. Puis le soleil est revenu comme si de rien n’était !","Một trận mưa thật to trong 10 phút. Rồi nắng lại lên như chưa có gì xảy ra!"]},{"e":"🪙","coins":2,"t":["Você achou 2 moedas perto de uma barraca de frutas!","Tu as trouvé 2 pièces près d’un stand de fruits !","Bạn tìm thấy 2 xu gần một sạp trái cây!"]},{"e":"🙏","t":["Uma moça cumprimentou você com o wai: mãos juntinhas e cabeça baixa. É o olá tailandês!","Une jeune femme t’a saluée avec le wai : les mains jointes et la tête baissée. C’est le bonjour thaïlandais !","Một cô gái chào bạn bằng cử chỉ wai: chắp tay và cúi đầu. Đó là cách chào của người Thái!"]}],"pos":{"x":779,"y":212}},"vietna":{"continent":"asia","flag":"🇻🇳","lat":21.03,"lon":105.85,"name":["Vietnã","Vietnam","Việt Nam"],"city":["Hanói","Hanoï","Hà Nội"],"apt":"Nội Bài","to":["para o Vietnã","au Vietnam","Việt Nam"],"dest":["para o Vietnã","vers le Vietnam","Việt Nam"],"climate":["Quente e úmido 🌦️","Chaud et humide 🌦️","Nóng ẩm 🌦️"],"currency":["Dong (₫)","Dong (₫)","Đồng (₫)"],"tip":["No Vietnã faz calor e às vezes cai uma chuva forte de repente.","Au Vietnam, il fait chaud et il y a parfois une grosse averse d’un coup.","Ở Việt Nam trời nóng và đôi khi có mưa rào bất chợt."],"needs":["guarda","protetor"],"uncomfy":"🥵","color":"#c9302c","stampE":"🏮","icons":"🍜🏮🛶","photoBg":"linear-gradient(#ffe3a3,#fff7e0)","scene":{"type":"campo","landmark":"🌾","deco":["🏮","👒","🛶"]},"hello":{"show":"Xin chào! Chào mừng đến Việt Nam!","say":"Xin chào! Chào mừng đến Việt Nam!","lang":"vi-VN","tr":["Olá! Bem-vinda ao Vietnã!","Bonjour ! Bienvenue au Vietnam !","Xin chào! Chào mừng đến Việt Nam!"]},"eat":[{"id":"pho","e":"🍜","p":8,"n":["Phở","Phở","Phở"],"f":["Sopa de macarrão de arroz com caldo bem cheiroso. No Vietnã, muita gente toma phở no café da manhã!","Une soupe de nouilles de riz au bouillon parfumé. Au Vietnam, beaucoup de gens mangent du phở au petit-déjeuner !","Món bánh phở với nước dùng thơm phức. Ở Việt Nam, nhiều người ăn phở vào bữa sáng!"]},{"id":"banhmi","e":"🥖","p":5,"n":["Bánh mì","Bánh mì","Bánh mì"],"f":["Sanduíche vietnamita no pão baguete. O pão chegou ao Vietnã vindo da França!","Un sandwich vietnamien dans une baguette. Le pain est arrivé au Vietnam depuis la France !","Bánh mì kẹp kiểu Việt Nam trong ổ bánh mì baguette. Bánh mì được người Pháp mang đến Việt Nam!"]},{"id":"goicuon","e":"🌯","p":6,"n":["Rolinho fresco (gỏi cuốn)","Rouleau de printemps (gỏi cuốn)","Gỏi cuốn"],"f":["Rolinho de papel de arroz com camarão e folhas de hortelã. Não é frito, é fresquinho!","Un rouleau de galette de riz avec crevettes et feuilles de menthe. Il n’est pas frit, il est tout frais !","Cuốn bánh tráng với tôm và rau thơm. Không chiên, ăn rất tươi mát!"]},{"id":"che","e":"🍧","p":4,"n":["Chè","Chè","Chè"],"f":["Sobremesa doce num copo, com feijão doce, frutas, gelo e leite de coco.","Un dessert sucré dans un verre, avec haricots sucrés, fruits, glace pilée et lait de coco.","Món ngọt đựng trong cốc, có đậu, hoa quả, đá bào và nước cốt dừa."]},{"id":"mia","e":"🥤","p":3,"n":["Caldo de cana","Jus de canne à sucre","Nước mía"],"f":["A cana-de-açúcar é espremida na hora, na frente de você, numa maquininha na rua.","La canne à sucre est pressée devant toi, dans une petite machine au bord de la rue.","Cây mía được ép ngay trước mặt bạn bằng một chiếc máy nhỏ bên đường."]}],"visit":[{"id":"halong","e":"🛶","p":22,"n":["Baía de Ha Long","Baie d’Along","Vịnh Hạ Long"],"f":["Quase 2.000 ilhas de pedra saindo do mar verde. Diz a lenda que um dragão desceu do céu e criou todas elas!","Presque 2 000 îles de pierre sortent de la mer verte. La légende dit qu’un dragon h."]},{"id":"natadola","e":"🏖️","p":0,"n":["Praia de Natadola","Plage de Natadola","Bãi biển Natadola"],"f":["Uma das praias mais bonitas de Fiji, com areia branquinha e água calma.","Une des plus belles plages des Fidji, avec du sable blanc et une eau calme.","Một trong những bãi biển đẹp nhất Fiji, với cát trắng và nước biển êm."]},{"id":"mercado","e":"🍍","p":0,"n":["Mercado de Nadi","Marché de Nadi","Chợ Nadi"],"f":["Montanhas de frutas tropicais: abacaxi, mamão, banana e coco. Olhar é de graça!","Des montagnes de fruits tropicaux : ananas, papaye, banane et noix de coco. Regarder, c’est gratuit !","Cả núi trái cây nhiệt đới: dứa, đu đủ, chuối và dừa. Ngắm thì miễn phí!"]},{"id":"sigatoka","e":"🏜️","p":5,"n":["Dunas de Sigatoka","Dunes de Sigatoka","Đồi cát Sigatoka"],"f":["Dunas de areia gigantes bem na beira do mar. Foi o primeiro parque nacional de Fiji!","Des dunes de sable géantes au bord de la mer. C’est le premier parc national des Fidji !","Những đồi cát khổng lồ ngay cạnh biển. Đây là vườn quốc gia đầu tiên của Fiji!"]},{"id":"golfinhos","e":"🐬","p":18,"n":["Passeio dos golfinhos","Sortie avec les dauphins","Đi ngắm cá heo"],"f":["Golfinhos-rotadores pulam e giram no ar, bem pertinho do barco!","Des dauphins à long bec sautent et tournent dans les airs, tout près du bateau !","Những chú cá heo nhảy lên và xoay tròn trên không, ngay sát thuyền!"]},{"id":"meke","e":"💃","p":5,"n":["Dança meke","Danse meke","Điệu múa meke"],"f":["Dança tradicional de Fiji que conta histórias com cantos, palmas e movimentos.","Une danse traditionnelle des Fidji qui raconte des histoires avec des chants, des battements de mains et des gestes.","Điệu múa truyền thống của Fiji kể chuyện bằng tiếng hát, tiếng vỗ tay và động tác."]}],"shop":[{"id":"colarflores","e":"🌺","p":6,"wear":"colarFlores","n":["Colar de flores","Collier de fleurs","Vòng hoa"],"f":["Em Fiji, os visitantes são recebidos com um colar de flores perfumadas, chamado salusalu.","Aux Fidji, on accueille les visiteurs avec un collier de fleurs parfumées, appelé salusalu.","Ở Fiji, du khách được chào đón bằng vòng hoa thơm, gọi là salusalu."]},{"id":"sulu","e":"👗","p":10,"n":["Sulu (saia de Fiji)","Sulu (jupe fidjienne)","Váy quấn sulu"],"f":["O sulu é um pano enrolado na cintura. Em Fiji, até os policiais usam!","Le sulu est un tissu noué autour de la taille. Aux Fidji, même les policiers en portent !","Sulu là tấm vải quấn quanh eo. Ở Fiji, ngay cả cảnh sát cũng mặc!"]},{"id":"masi","e":"🖼️","p":14,"n":["Pano masi","Tissu masi","Vải masi"],"f":["Um pano feito da casca de uma árvore, batida até ficar fininha e pintada com desenhos.","Un tissu fait avec l’écorce d’un arbre, battue jusqu’à devenir fine, puis décorée de motifs.","Tấm vải làm từ vỏ cây, được đập cho thật mỏng rồi vẽ hoa văn lên."]},{"id":"tartaruga","e":"🐢","p":9,"n":["Tartaruga de madeira","Tortue en bois","Rùa gỗ"],"f":["Tartarugas marinhas nadam nos recifes de Fiji. Os artesãos esculpem elas em madeira.","Des tortues de mer nagent dans les récifs des Fidji. Les artisans les sculptent dans le bois.","Rùa biển bơi quanh các rạn san hô ở Fiji. Nghệ nhân khắc chúng bằng gỗ."]}],"walk":[{"e":"👋","t":["Todo mundo que passa sorri e diz “Bula!” para você.","Tous les gens qui passent te sourient et te disent « Bula ! ».","Ai đi ngang qua cũng mỉm cười và nói “Bula!” với bạn."]},{"e":"🪙","coins":3,"t":["Você achou 3 moedas perto de um coqueiro!","Tu as trouvé 3 pièces au pied d’un cocotier !","Bạn tìm thấy 3 xu dưới gốc cây dừa!"]},{"e":"🦀","t":["Um caranguejinho saiu correndo de lado na areia!","Un petit crabe est parti en courant de côté sur le sable !","Một chú cua nhỏ chạy ngang trên cát!"]},{"e":"🕰️","t":["Ninguém tem pressa aqui. Os fijianos chamam isso de “Fiji time”!","Ici, personne n’est pressé. Les Fidjiens appellent ça le « Fiji time » !","Ở đây chẳng ai vội vàng. Người Fiji gọi đó là “Fiji time”!"]}],"pos":{"x":993,"y":299}},"novazelandia":{"continent":"oceania","flag":"🇳🇿","lat":-36.85,"lon":174.76,"name":[" let AC=null;
function beep(f,dur,type,vol,when){
 if(G.mute)return;
 try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+(when||0);
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(vol||.12,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+.02);
 }catch(e){}
}

function mapSVG(ret){
 const c=COUNTRIES[T.c];const a=ret?c.pos:HOME,b=ret?HOME:c.pos;
 const dist=Math.hypot(b.x-a.x,b.y-a.y);const cx=(a.x+b.x)/2,cy=Math.min(a.y,b.y)-dist*.3;
 const d=`M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`;
 const minx=Math.min(a.x,b.x)-140,maxx=Math.max(a.x,b.x)+140;
 let w=Math.min(1000,Math.max(maxx-minx,380)),h=w/2;
 const top=Math.min(a.y,b.y,cy),bot=Math.max(a.y,b.y);
 let vx=Math.max(0,Math.min(1000-w,(minx+maxx)/2-w/2)),vy=Math.max(0,Math.min(500-h,(top+bot)/2-h/2));
 const fs=w*.055;
 const pin=(pt,e,label)=>`<circle cx="${pt.x}" cy="${pt.y}" r="${fs*.18}" fill="#ff6b8b" stroke="#fff" stroke-width="${fs*.06}"/><text x="${pt.x}" y="${pt.y-fs*.45}" text-anchor="middle" font-size="${fs*.75}">${e}</text><text x="${pt.x}" y="${pt.y+fs*.75}" text-anchor="middle" font-size="${fs*.4}" font-weight="700" fill="#2b2350" font-family="inherit">${esc(label)}</text>`;
 return `<svg viewBox="${vx} ${vy} ${w} ${h}" preserveAspectRatio="xMidYMid meet"><rect x="0" y="0" width="1000" height="500" fill="#7fc7ef"/>${CONTINENTS}
 <path d="${d}" fill="none" stroke="#fff" stroke-width="${fs*.07}" stroke-dasharray="${fs*.25} ${fs*.2}" opacity=".9"/>
 <path id="routeDone" d="${d}" fill="none" stroke="#ff6b8b" stroke-width="${fs*.1}" stroke-linecap="round"/>
 ${pin(HOME,'🏠',t('home_lbl'))}${Math.hypot(c.pos.x-HOME.x,c.pos.y-HOME.y)<40?pin(c.pos,c.stampE,'',true):pin(c.pos,c.stampE,tx(c.city))}
 <text id="plane" font-size="${fs}" text-anchor="middle" dominant-baseline="central">✈️</text></svg>`;
}

function startFlight(){
 cancelAnimationFrame(raf);let last=performance.now();
 const step=now=>{
  const dt=Math.min(100,now-last);last=now;
  if(ui.screen!=='flight')return;
  const dur=flightMs();
  if(!modalOpen&&ui.fp<1)ui.fp=Math.min(1,ui.fp+dt/(ui.sleeping?dur/5:dur));
  placePlane();
  const fl=document.getElementById('flLeft');if(fl){const s=Math.ceil((1-ui.fp)*(ui.sleeping?dur/5:dur)/1000);fl.textContent='⏱️ '+t('fl_left',{t:`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`});}
  if(ui.fp>=.35&&!ui.snackDone&&!modalOpen&&!ui.sleeping)snackModal();
  if(ui.fp>=.72&&!ui.drinkDone&&!modalOpen&&!ui.sleeping)drinkModal();
  if(ui.fp>=1&&!ui.landed){landed();return;}
  raf=requestAnimationFrame(step);
 };
 raf=requestAnimationFrame(step);
}
function placePlane(){
 const path=document.getElementById('routeDone'),pl=document.getElementById('plane');if(!path||!pl)return;
 const len=path.getTotalLength(),f=ui.fp||0;
 const p1=path.getPointAtLength(len*f),p0=path.getPointAtLength(Math.max(0,len*f-2)),p2=path.getPointAtLength(Math.min(len,len*f+2));

const SKY=[[0,'#86cfff','#e3f6ff'],[.45,'#4aa8ff','#bfe6ff'],[.75,'#ff9f6a','#ffe0a8'],[.9,'#7c58b8','#ff9f8a'],[1,'#26285e','#5b4b9a']];
function hex2rgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function lerpC(a,b,k){const A=hex2rgb(a),B=hex2rgb(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')';}
function skyAt(p){for(let i=0;i<SKY.length-1;i++){const [p0,a0,b0]=SKY[i],[p1,a1,b1]=SKY[i+1];if(p<=p1){const k=(p-p0)/(p1-p0);return [lerpC(a0,a1,k),lerpC(b0,b1,k)];}}return [SKY[4][1],SKY[4][2]];}
const clamp01=x=>Math.max(0,Math.min(1,x));
function hasCamera(){return T.packed.includes('camera')||T.bought.includes('need_camera');}

 const c=COUNTRIES[T.c];

 return c[kind].find(a=>a.id===id);
}

function setTab(k){ui.tab=k;sfx.click();render();}
function startDayTimer(){stopDayTimer();lastTs=performance.now();dayTimer=setInterval(tickDay,250);}
function stopDayTimer(){if(dayTimer)clearInterval(dayTimer);dayTimer=null;}
function tickDay(){
 const now=performance.now(),dt=now-lastTs;lastTs=now;
 if(!T||ui.screen!=='day'||modalOpen||document.hidden||T.dayOver)return;
 T.elapsed=Math.min(T.dayMs,T.elapsed+dt);updateDayVisuals();
 if(T.elapsed>=T.dayMs)endDay();
}
function updateDayVisuals(){
 if(!T)return;const p=clamp01(T.elapsed/T.dayMs);
 const [c1,c2]=skyAt(p),$=id=>document.getElementById(id);
 if($('sk1')){$('sk1').setAttribute('stop-color',c1);$('sk2').setAttribute('stop-color',c2);}
 const sun=$('sun');if(sun){const q=Math.min(p/.92,1);sun.setAttribute('cx',60+p*680);sun.setAttribute('cy',210-Math.sin(q*Math.PI)*170);sun.setAttribute('fill',p>.7?'#ffab40':'#ffd23f');sun.style.opacity=p>.93?0:1;}
 if($('stars'))$('stars').setAttribute('opacity',clamp01((p-.85)/.15));
 if($('moon'))$('moon').setAttribute('opacity',clamp01((p-.88)/.12));
 if($('wins'))$('wins').setAttribute('opacity',.25+.75*clamp01((p-.7)/.3));
 const mins=Math.floor((480+p*720)/10)*10,hh=String(Math.floor(mins/60)).padStart(2,'0'),mm=String(mins%60).padStart(2,'0');
 if($('clockT'))$('clockT').textContent=`🕐 ${hh}:${mm}`;
 if($('clockP'))$('clockP').textContent=p<.33?'☀️ '+t('morning'):p<.75?'🌤️ '+t('afternoon'):'🌇 '+t('evening');
 if($('clockFill'))$('clockFill').style.width=(p*100)+'%';
 if($('clockBar'))$('clockBar').classList.toggle('late',p>.85);
}

function doReset(){const lang=G.lang;try{localStorage.removeItem(SAVE_KEY);}catch(e){}G=JSON.parse(JSON.stringify(DEF));G.lang=lang;save();T=null;go('title');}

document.addEventListener('visibilitychange',()=>{lastTs=performance.now();});
render();
